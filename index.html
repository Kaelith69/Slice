<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f5">
<title>Slice — split an image into squares</title>
<style>
:root{color-scheme:light;--bg:#f5f5f5;--card:#fbfdfd;--card-t:#ffffff;--well:#dff1f1;--grid:rgba(187,213,218,.75);--text:#0f2a30;--muted:#47616a;--line:rgba(15,42,48,.14);--hi:rgba(255,255,255,.95);--accent:#ff0000;--accent2:#ff4a4a;--ink:#c40000;--on:#fff;--cut:#fff;--fill:#0f2a30;--okbg:#0f2a30;--okfg:#dff1f1;--track:#d3e8ea;--dim:rgba(8,28,33,.55);--sh:0 1px 2px rgba(15,42,48,.08),0 18px 40px -18px rgba(15,42,48,.32);--chk:#cfe3e6;--chk2:#f0f8f8;--seg:#dff1f1;--err:#b3261e}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1113;--card:#121a1d;--card-t:#182226;--well:#0d1518;--grid:rgba(187,213,218,.07);--text:#e6f3f3;--muted:#92abb1;--line:rgba(223,241,241,.13);--hi:rgba(223,241,241,.07);--accent:#f23838;--accent2:#ff6060;--ink:#ff7676;--on:#fff;--cut:#fff;--fill:#bbd5da;--okbg:#bbd5da;--okfg:#0b1113;--track:#24353a;--dim:rgba(0,0,0,.62);--sh:0 1px 2px rgba(0,0,0,.6),0 18px 40px -18px rgba(0,0,0,.95);--chk:#202e33;--chk2:#2d3f45;--seg:#0a1013;--err:#ff8a80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{display:block}
.top{max-width:1080px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:-.01em}
.glyph{width:30px;height:30px;border-radius:8px;background:linear-gradient(180deg,var(--accent2),var(--accent));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 6px -2px var(--accent);display:grid;place-items:center}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--seg);box-shadow:inset 0 1px 2px rgba(0,0,0,.18)}
.seg button{border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--muted);display:flex;align-items:center;justify-content:center;min-height:30px}
.seg button[aria-checked="true"]{background:var(--card-t);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.25),inset 0 1px 0 var(--hi)}
.theme button{padding:6px 10px}
.app{max-width:1080px;margin:0 auto;padding:0 24px 40px;display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:20px;align-items:start}
.card{background:linear-gradient(180deg,var(--card-t),var(--card));border-radius:22px;box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px var(--line),var(--sh)}
.stage{position:relative;height:clamp(340px,70vh,660px);padding:10px;display:flex;flex-direction:column;gap:8px}
.well{position:relative;flex:1;min-height:0;border-radius:14px;background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/24px 24px,var(--well);box-shadow:inset 0 2px 6px rgba(0,0,0,.18),inset 0 0 0 1px var(--line);overflow:hidden}
.drop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:24px;cursor:pointer;border-radius:14px;transition:background .2s}
.drop.over{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.drop .ico{width:56px;height:56px;border-radius:16px;background:linear-gradient(180deg,var(--card-t),var(--card));box-shadow:0 0 0 1px var(--line),0 6px 16px -6px rgba(0,0,0,.35),inset 0 1px 0 var(--hi);display:grid;place-items:center;color:var(--ink);margin-bottom:10px}
.drop h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.015em}
.drop p{margin:0;color:var(--muted);font-size:14px}
.drop .err{color:var(--err);min-height:20px;margin-top:6px}
.canvas{position:absolute;inset:0;display:grid;place-items:center;padding:16px}
.wrap{cursor:crosshair;position:relative;border-radius:4px;background:repeating-conic-gradient(var(--chk) 0 25%,var(--chk2) 0 50%) 0 0/16px 16px;box-shadow:0 8px 24px -8px rgba(0,0,0,.5);touch-action:none;user-select:none;-webkit-user-select:none}
.wrap img{display:block;width:100%;height:100%;pointer-events:none}
.crop{position:absolute;box-shadow:0 0 0 3px rgba(0,0,0,.35),0 0 0 9999px var(--dim);outline:2px solid var(--cut);cursor:move;touch-action:none}
.cells{position:absolute;inset:0;display:flex;pointer-events:none}
.cells span{flex:1;position:relative}
.cells span+span{box-shadow:-1px 0 0 var(--cut),-2px 0 0 rgba(0,0,0,.35)}
.cells i{position:absolute;left:5px;top:5px;font:600 11px/1 -apple-system,system-ui,sans-serif;color:#0f2a30;background:#dff1f1;padding:3px 6px;border-radius:6px;font-style:normal}
.cells.tiny i{display:none}
.hd{position:absolute;width:44px;height:44px;transform:translate(-50%,-50%);display:grid;place-items:center;touch-action:none}
.hd::before{content:"";width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.45)}
.hd.n::before,.hd.s::before{width:28px;height:6px;border-radius:4px}
.hd.e::before,.hd.w::before{width:6px;height:28px;border-radius:4px}
.hd.nw{left:0;top:0;cursor:nwse-resize}.hd.n{left:50%;top:0;cursor:ns-resize}.hd.ne{left:100%;top:0;cursor:nesw-resize}
.hd.e{left:100%;top:50%;cursor:ew-resize}.hd.se{left:100%;top:100%;cursor:nwse-resize}.hd.s{left:50%;top:100%;cursor:ns-resize}
.hd.sw{left:0;top:100%;cursor:nesw-resize}.hd.w{left:0;top:50%;cursor:ew-resize}
.crop[data-mode="square"] .hd.n,.crop[data-mode="square"] .hd.s,.crop[data-mode="square"] .hd.e,.crop[data-mode="square"] .hd.w{display:none}
.results{position:absolute;inset:0;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px;align-content:start}
.tile{margin:0}
.tile .im{border-radius:10px;overflow:hidden;background:repeating-conic-gradient(var(--chk) 0 25%,var(--chk2) 0 50%) 0 0/14px 14px;box-shadow:0 0 0 1px var(--line),0 4px 12px -4px rgba(0,0,0,.4)}
.tile img{display:block;width:100%;height:100%;object-fit:cover}
.tile figcaption{text-align:center;font-size:12px;font-weight:600;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.panel{padding:20px;display:flex;flex-direction:column;gap:20px}
.sec{display:flex;flex-direction:column;gap:12px}
#ctrl{display:flex;flex-direction:column}
.sec+.sec{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.lab{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.big{font-size:34px;line-height:1;font-weight:600;color:var(--text);letter-spacing:-.03em;font-variant-numeric:tabular-nums;text-transform:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none;margin:0;--p:25%;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--fill) var(--p),var(--track) var(--p));box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:linear-gradient(180deg,#fff,#ececf0);box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 3px 8px rgba(0,0,0,.35),inset 0 -1px 0 rgba(0,0,0,.08)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--track);box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
input[type=range]::-moz-range-progress{height:8px;border-radius:99px;background:var(--fill)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:linear-gradient(180deg,#fff,#ececf0);box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 3px 8px rgba(0,0,0,.35)}
input[type=range]:focus-visible,.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.ticks{display:flex;justify-content:space-between;margin-top:-2px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ticks span{width:28px;text-align:center}.ticks .on{color:var(--text);font-weight:600}
.seg.full{display:flex}.seg.full button{flex:1}
.info{font-size:14px;color:var(--muted);line-height:1.5}.info b{color:var(--text);font-weight:600}
.btn{width:100%;min-height:48px;border-radius:13px;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.pri{font-size:18px;font-weight:700;color:var(--on);background:linear-gradient(180deg,var(--accent2),var(--accent));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 .5px rgba(0,0,0,.3),0 6px 14px -6px var(--accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sec2{min-height:40px;font-size:14px;font-weight:500;color:var(--accent)}
.btn.sec2:hover{filter:brightness(1.15)}
.bar{height:10px;border-radius:99px;background:var(--track);box-shadow:inset 0 1px 2px rgba(0,0,0,.3);overflow:hidden}
.bar div{height:100%;width:0;border-radius:99px;background:linear-gradient(180deg,var(--accent2),var(--accent));box-shadow:inset 0 1px 0 rgba(255,255,255,.4);transition:width .25s ease}
.pl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.pl span:first-child{font-weight:600}.pl span:last-child{color:var(--muted)}
.done h3{margin:0 0 4px;font-size:20px;font-weight:600;letter-spacing:-.02em}
.done p{margin:0;color:var(--muted);font-size:14px}
.status{min-height:18px;font-size:13px;color:var(--muted);text-align:center}
.hide,[hidden]{display:none!important}
.sbar{display:flex;align-items:center;gap:8px;min-height:34px;padding:0 0 0 6px}
.chip{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip b{color:var(--text);font-weight:600}
.link{font-size:13px;font-weight:600;color:var(--ink);padding:6px 12px;border-radius:9px;min-height:34px;box-shadow:0 0 0 1px var(--line)}
.link:hover{background:color-mix(in srgb,var(--ink) 10%,transparent)}
.hintbar{font-size:13px;color:var(--muted);text-align:center;min-height:20px;padding:0 6px}
.pill{margin-top:12px;padding:10px 26px;border-radius:99px;font-weight:700;font-size:18px;color:var(--on);background:linear-gradient(180deg,var(--accent2),var(--accent));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 10px -4px var(--accent)}
.drop::after{content:"";position:absolute;inset:12px;border:2px dashed color-mix(in srgb,var(--accent) 45%,transparent);border-radius:12px;pointer-events:none}
.stepper{display:flex;align-items:center;gap:4px;text-transform:none}
.stepper button{width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1;display:grid;place-items:center;color:var(--text);background:linear-gradient(180deg,var(--card-t),var(--card));box-shadow:0 0 0 1px var(--line),0 2px 5px -1px rgba(0,0,0,.25),inset 0 1px 0 var(--hi)}
.stepper button:active{transform:scale(.94)}.stepper button:disabled{opacity:.3;pointer-events:none}
.stepper .big{min-width:46px;text-align:center}
.glyph svg{fill:var(--on)}
.link:focus-visible,.stepper button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.info small{display:block;margin-top:6px;font-size:13px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.btn.pri:hover{filter:brightness(1.07)}
.btn.pri:active{filter:brightness(.9);box-shadow:inset 0 3px 6px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.3)}
.btn.pri.ok{background:var(--okbg);color:var(--okfg);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.btn:disabled{opacity:.45;filter:grayscale(.6);pointer-events:none}
.btn.sec2{border-radius:12px}.btn.sec2:hover,.link:hover{background:color-mix(in srgb,var(--ink) 10%,transparent)}
.btn.sec2:active,.link:active{background:color-mix(in srgb,var(--ink) 20%,transparent);transform:scale(.97)}
.seg button:hover:not([aria-checked="true"]){background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--text)}
.seg button:active{transform:scale(.96)}
.stepper button:hover{background:color-mix(in srgb,var(--ink) 10%,var(--card-t))}
.pill{transition:filter .15s,transform .12s}.drop:hover .pill{filter:brightness(1.08)}.drop:active .pill{transform:scale(.96);filter:brightness(.92)}
.drop:focus-visible{outline:2px solid var(--ink);outline-offset:-6px}
.crop:focus-visible{outline-color:#fff;box-shadow:0 0 0 4px var(--ink),0 0 0 9999px var(--dim)}
.crop.sm .hd{width:28px;height:28px}.crop.sm .hd::before{width:12px;height:12px}
.demo{display:flex;gap:6px;margin-top:16px}.demo i{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;font:600 11px/1 system-ui,sans-serif;font-style:normal;color:var(--text);background:var(--track);box-shadow:inset 0 0 0 1px var(--line)}.demo i:nth-child(odd){background:var(--card-t)}
.tile{display:block;width:100%;padding:0;text-align:center;border-radius:12px;transition:transform .15s}
.tile:hover{transform:translateY(-2px)}.tile:active{transform:scale(.97)}.tile:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.tile .cap{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:6px}.tile:hover .cap{color:var(--ink)}.tile.ok .cap{color:var(--text)}.tile.ok .cap::after{content:" ✓"}
.tog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);cursor:pointer;margin-top:12px;min-height:32px}.tog input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.warn{color:var(--err)}
.pv{font-size:13px;font-weight:600;color:var(--text);text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.txt{width:100%;min-height:46px;padding:0 14px;border:0;border-radius:12px;font:inherit;font-size:16px;font-weight:600;color:var(--text);background:var(--card-t);box-shadow:inset 0 1px 3px rgba(0,0,0,.18),0 0 0 1px var(--line)}
.txt::placeholder{color:var(--muted);font-weight:400}.txt:hover{box-shadow:inset 0 1px 3px rgba(0,0,0,.18),0 0 0 1px var(--ink)}
.txt:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.cells i{max-width:calc(100% - 10px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.hintbar.err{color:var(--err);font-weight:600}
.app[data-s="busy"] #swap,.app[data-s="busy"] #reset{pointer-events:none;opacity:.45}.app[data-s="busy"] #ctrl{opacity:.5}
@media(max-width:820px){.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0!important;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))!important;background:var(--card);border:0!important;border-top:1px solid var(--line)!important;box-shadow:0 -10px 28px -14px rgba(0,0,0,.35)}.app{padding-bottom:180px!important}.stage{height:clamp(270px,46vh,420px)!important}}
@media(max-height:480px) and (orientation:landscape){.stage{height:calc(100vh - 120px)!important;min-height:240px}}
.app[data-s="empty"] #ctrl{opacity:.45;pointer-events:none}
@media(max-width:820px){.top{padding:14px 16px}.app{grid-template-columns:1fr;padding:0 14px calc(28px + env(safe-area-inset-bottom,0px));gap:14px}.stage{height:clamp(280px,50vh,460px)}.panel{padding:18px}}

/* ---- responsive system: phone / tablet / laptop / desktop ---- */
:root{--gx:24px}
html{-webkit-text-size-adjust:100%}
button,label,.drop{touch-action:manipulation}
.stage{height:clamp(380px,calc(100vh - 190px),760px);height:clamp(380px,calc(100dvh - 190px),760px)}
.top,.app{padding-left:max(var(--gx),env(safe-area-inset-left,0px));padding-right:max(var(--gx),env(safe-area-inset-right,0px))}
.link{white-space:nowrap}.chip{min-width:0}
@media(min-width:821px){
  .app{align-items:stretch}
  .panel{min-height:0;overflow:hidden}
  #ctrl{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -8px;padding:0 8px;scrollbar-width:thin}
}
@media(min-width:1200px){.top,.app{max-width:1200px}.app{grid-template-columns:minmax(0,1fr) 344px}}
@media(max-height:620px){.demo,.drop>p:not(.err){display:none}}
@media(max-height:520px){.drop .ico{display:none}}
@media(max-width:820px){
  :root{--gx:16px}
  .demo{display:none}.drop{padding:12px}.drop .ico{width:44px;height:44px;margin-bottom:6px}
  .hintbar{min-height:34px;line-height:1.35;font-size:12.5px}
  .app{padding-bottom:calc(210px + env(safe-area-inset-bottom,0px))!important}
  .dock{padding:12px max(16px,calc((100vw - 560px)/2),env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,calc((100vw - 560px)/2),env(safe-area-inset-left,0px))!important}
}
@media(min-width:561px) and (max-width:820px){
  .stage{height:clamp(340px,52vh,640px)!important;height:clamp(340px,52dvh,640px)!important}
  #ctrl{display:grid;grid-template-columns:1fr 1fr;gap:20px 28px}
  #ctrl .sec+.sec{margin:0;padding:0;border:0}
  #ctrl .sec:nth-child(3){grid-column:1/-1}
}
@media(max-width:560px){
  .stage{height:clamp(280px,48vh,440px)!important;height:clamp(280px,48dvh,440px)!important}
  .stage{padding:8px}.panel{padding:16px}.big{font-size:30px}
  .results{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;padding:10px}
}
@media(pointer:coarse){.seg button{min-height:40px}.link{min-height:40px}.stepper button{width:40px;height:40px}.tog{min-height:40px}}
@media(max-height:520px) and (orientation:landscape){
  .top{padding-top:8px;padding-bottom:8px}
  .app{grid-template-columns:minmax(0,1fr) 290px!important;padding-bottom:12px!important;gap:12px;align-items:stretch}
  .stage{height:calc(100vh - 66px)!important;height:calc(100dvh - 66px)!important;min-height:230px}
  .panel{min-height:0;overflow:hidden;padding:14px;gap:12px}
  #ctrl:not([hidden]){display:flex!important;flex:1 1 auto;min-height:0;overflow-y:auto;margin:0 -8px;padding:0 8px}
  #ctrl .sec+.sec{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .dock{position:static!important;padding:0!important;margin:0!important;background:none!important;box-shadow:none!important;border:0!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="glyph"><svg width="16" height="16" viewBox="0 0 16 16" fill="#fff"><rect x="1" y="3" width="4" height="10" rx="1.2"/><rect x="6" y="3" width="4" height="10" rx="1.2"/><rect x="11" y="3" width="4" height="10" rx="1.2"/></svg></div>Slice</div>
  <div class="seg theme" role="radiogroup" aria-label="Theme">
    <button role="radio" data-t="light" aria-label="Light" title="Light"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button role="radio" data-t="dark" aria-label="Dark" title="Dark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
  </div>
</header>

<main class="app" id="app" data-s="empty">
  <section class="card stage">
    <div class="sbar" id="sbar" hidden><div class="chip" id="chip"></div><button class="link" id="reset">Select all</button><button class="link" id="swap" aria-label="Replace image">Replace</button></div>
    <div class="well" id="well">
      <label class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a PNG image">
        <div class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></div>
        <h2>Drop a PNG here</h2><p>It’s cut into tiles you can download as a folder.</p>
        <span class="pill">Choose PNG</span><div class="demo" aria-hidden="true"><i>a1</i><i>a2</i><i>a3</i><i>a4</i></div>
        <p class="err" id="err" role="alert"></p>
        <input type="file" id="file" accept="image/png,image/*" hidden>
      </label>
      <div class="canvas" id="canvas" hidden>
        <div class="wrap" id="wrap"><img id="img" alt="Image to crop" draggable="false">
          <div class="crop" id="crop" tabindex="0" role="group" aria-label="Crop area"><div class="cells" id="cells"></div>
            <div class="hd nw" data-h="nw"></div><div class="hd n edge" data-h="n"></div><div class="hd ne" data-h="ne"></div><div class="hd e edge" data-h="e"></div>
            <div class="hd se" data-h="se"></div><div class="hd s edge" data-h="s"></div><div class="hd sw" data-h="sw"></div><div class="hd w edge" data-h="w"></div>
          </div>
        </div>
      </div>
      <div class="results" id="results" hidden></div>
    </div>
    <div class="hintbar" id="hint"></div>
  </section>

  <aside class="card panel">
    <div id="ctrl">
      <div class="sec">
        <div class="lab"><label for="n">Slices</label><div class="stepper"><button id="dec" aria-label="Fewer slices">−</button><span class="big" id="nv" aria-live="polite">4</span><button id="inc" aria-label="More slices">+</button></div></div>
        <div><input type="range" id="n" min="2" max="10" step="1" value="4" aria-label="Number of squares">
        <div class="ticks" id="ticks" aria-hidden="true"></div></div>
      </div>
      <div class="sec">
        <div class="lab">Crop</div>
        <div class="seg full" id="mode" role="radiogroup" aria-label="Crop shape">
          <button role="radio" data-m="square" aria-checked="true">Square tiles</button>
          <button role="radio" data-m="free" aria-checked="false">Free</button>
        </div>
        <div class="info" id="info"></div>
      </div>
      <div class="sec">
        <div class="lab"><label for="pre">Name prefix</label><span class="pv" id="pv"></span></div>
        <input class="txt" id="pre" type="text" value="a" placeholder="a" maxlength="20" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-describedby="pvh">
        <div class="info" id="pvh"><small style="margin:0">Letters, numbers, - and _ only. Type “as” to get as1, as2, as3…</small></div>
        <label class="tog"><input type="checkbox" id="pad"><span>Zero-pad numbers (01, 02…)</span></label>
      </div>
    </div>

    <div id="actions" class="sec dock" style="padding-top:0;border:0;gap:6px">
      <button class="btn pri" id="go" disabled>Slice image</button>
      
    </div>

    <div id="prog" class="dock" hidden>
      <div class="pl" aria-live="polite"><span id="pt">Preparing…</span><span id="pp">0%</span></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="pb"><div id="pf"></div></div>
    </div>

    <div class="done" id="done" hidden>
      <div class="sec" style="gap:4px"><h3 id="dt"></h3><p id="ds"></p></div>
      <div class="sec dock" style="padding:0;border:0;margin-top:16px;gap:6px">
        <button class="btn pri" id="dl"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 20h14"/></svg>Download folder</button>
        <div class="status" id="st" aria-live="polite"></div>
        <div class="two"><button class="btn sec2" id="back">Back to crop</button><button class="btn sec2" id="again">New image</button></div>
      </div>
    </div>
  </aside>
</main>

<script>
(()=>{
const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.min(Math.max(v,a),b),wait=ms=>new Promise(r=>setTimeout(r,ms));
const app=$('#app'),img=$('#img'),wrap=$('#wrap'),crop=$('#crop'),cells=$('#cells'),well=$('#well'),slider=$('#n'),hint=$('#hint');
const S={nw:0,nh:0,k:1,box:null,n:4,mode:'square',pad:false,prefix:'a',zip:null,files:[],urls:[],srcUrl:null};
const CHECK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const nm=i=>S.prefix+(S.pad?String(i+1).padStart(2,'0'):i+1);

/* radio groups with arrow-key navigation */
function radio(g){const sync=()=>g.querySelectorAll('[role=radio]').forEach(b=>b.tabIndex=b.getAttribute('aria-checked')==='true'?0:-1);
  g.addEventListener('click',()=>queueMicrotask(sync));
  g.addEventListener('keydown',e=>{const k={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];if(!k)return;const bs=[...g.querySelectorAll('[role=radio]')],i=bs.indexOf(document.activeElement);if(i<0)return;e.preventDefault();const t=bs[(i+k+bs.length)%bs.length];t.click();t.focus()});sync();}

/* theme */
const root=document.documentElement;
function setTheme(t,save){root.dataset.theme=t;document.querySelectorAll('.theme button').forEach(b=>b.setAttribute('aria-checked',b.dataset.t===t));
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(root).getPropertyValue('--bg').trim();
  if(save)try{localStorage.setItem('slice-theme',t)}catch(e){}}
let t0;try{t0=localStorage.getItem('slice-theme')}catch(e){}
setTheme(t0||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
document.querySelectorAll('.theme button').forEach(b=>b.onclick=()=>setTheme(b.dataset.t,1));
radio($('.theme'));radio($('#mode'));
$('#ticks').innerHTML=Array.from({length:9},(_,i)=>`<span>${i+2}</span>`).join('');

/* state */
function state(s){app.dataset.s=s;
  $('#drop').hidden=s!=='empty';$('#canvas').hidden=!(s==='edit'||s==='busy');$('#results').hidden=s!=='done';
  $('#ctrl').hidden=s==='done';$('#ctrl').inert=s==='empty'||s==='busy';$('#actions').hidden=s==='busy'||s==='done';$('#prog').hidden=s!=='busy';$('#done').hidden=s!=='done';
  $('#sbar').hidden=s==='empty';$('#go').disabled=s==='empty';
  hint.className='hintbar';hint.textContent={empty:'',edit:'Drag to draw a crop · drag the box to move it · pull a corner to resize',busy:'Slicing your image…',done:'Tap a tile to save it on its own.'}[s];
  if(s==='edit'||s==='busy')requestAnimationFrame(layout);}
function hintErr(m){hint.textContent=m;hint.className='hintbar err'}

/* load */
const fileIn=$('#file'),drop=$('#drop');
fileIn.onchange=()=>fileIn.files[0]&&load(fileIn.files[0]);
$('#swap').onclick=$('#again').onclick=()=>fileIn.click();
drop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fileIn.click()}});
['dragenter','dragover'].forEach(e=>well.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(e=>well.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over')}));
well.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];f&&load(f)});
function load(f){
  if(!f.type.startsWith('image/')){$('#err').textContent='That file isn’t an image. Try a PNG.';return}
  const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{if(S.srcUrl)URL.revokeObjectURL(S.srcUrl);S.srcUrl=u;img.src=u;S.nw=im.naturalWidth;S.nh=im.naturalHeight;S.src=im;
    const c=$('#chip'),b=document.createElement('b');b.textContent=f.name;c.textContent='';c.append(b,` · ${S.nw} × ${S.nh} px`);
    $('#err').textContent='';initBox();buildCells();state('edit');fileIn.value=''};
  im.onerror=()=>{$('#err').textContent='Couldn’t read that image.';URL.revokeObjectURL(u)};
  im.src=u;}

/* geometry */
function initBox(full){const W=S.nw,H=S.nh,n=S.n,f=full?1:.92;
  if(S.mode==='square'){const w=Math.min(W*f,H*f*n);S.box={x:(W-w)/2,y:(H-w/n)/2,w,h:w/n}}
  else S.box={x:W*(1-f)/2,y:H*(1-f)/2,w:W*f,h:H*f};}
function refit(){if(S.mode!=='square')return;const b=S.box,r=S.n,W=S.nw,H=S.nh,cx=b.x+b.w/2,cy=b.y+b.h/2;
  const w=Math.min(b.h*r,W,H*r),h=w/r;S.box={x:clamp(cx-w/2,0,W-w),y:clamp(cy-h/2,0,H-h),w,h};}
function layout(){if(!S.nw)return;const c=$('#canvas'),aw=c.clientWidth-32,ah=c.clientHeight-32;if(aw<=0)return;
  S.k=Math.min(aw/S.nw,ah/S.nh);wrap.style.width=S.nw*S.k+'px';wrap.style.height=S.nh*S.k+'px';render();}
function dims(){const b=S.box;if(!b)return[0,0];const h=Math.max(1,Math.floor(b.h));return S.mode==='square'?[h,h]:[Math.max(1,Math.floor(b.w/S.n)),h]}
const MAX=128;
function outDims(){const[w,h]=dims(),k=Math.min(1,MAX/Math.max(w,h));return[Math.max(1,Math.round(w*k)),Math.max(1,Math.round(h*k))]}
/* downscale in halving steps so large crops stay sharp instead of aliasing */
function resample(src,sx,sy,sw,sh,tw,th){let cur=src,cx=sx,cy=sy,cw=sw,ch=sh;
  while(cw>tw*2||ch>th*2){const nw=Math.max(tw,Math.ceil(cw/2)),nh=Math.max(th,Math.ceil(ch/2)),c=document.createElement('canvas');c.width=nw;c.height=nh;
    const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(cur,cx,cy,cw,ch,0,0,nw,nh);cur=c;cx=cy=0;cw=nw;ch=nh}
  const o=document.createElement('canvas');o.width=tw;o.height=th;const x=o.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(cur,cx,cy,cw,ch,0,0,tw,th);return o}
function render(){const b=S.box,k=S.k;if(!b)return;
  Object.assign(crop.style,{left:b.x*k+'px',top:b.y*k+'px',width:b.w*k+'px',height:b.h*k+'px'});
  cells.classList.toggle('tiny',b.w*k/S.n<22+nm(S.n-1).length*6);crop.classList.toggle('sm',Math.min(b.w,b.h)*k<96);crop.dataset.mode=S.mode;
  const[w,h]=dims();crop.setAttribute('aria-label',`Crop area, ${w*S.n} by ${h} pixels. Arrow keys move it, plus and minus resize it.`);info();}
function buildCells(){cells.innerHTML=Array.from({length:S.n},(_,i)=>`<span><i>${nm(i)}</i></span>`).join('')}
function info(){$('#pv').textContent=nm(0)+', '+nm(1)+'…';const[sw,sh]=dims(),[w,h]=outDims();if(!S.box){$('#info').textContent='Add an image to begin.';return}
  $('#info').innerHTML=`<b>${S.n} ${S.mode==='square'?'squares':'tiles'}</b> · ${w} × ${h} px each<br>Named ${nm(0)} – ${nm(S.n-1)}<small>${S.mode==='square'?'The box stays 1 : '+S.n+', so every tile is a perfect square. Tiles export at up to 128 × 128 px.':'Any crop you like. Tiles share the box’s height and split its width evenly. Tiles export at up to 128 px on the longest side.'}</small>${Math.min(sw,sh)<96?'<small class="warn">Tiles are small. Use fewer slices or a wider crop for sharper results.</small>':''}`;}
if(window.ResizeObserver)new ResizeObserver(layout).observe(well);

/* controls */
function setN(){S.n=+slider.value;$('#nv').textContent=S.n;$('#go').textContent=`Slice into ${S.n} ${S.mode==='square'?'squares':'tiles'}`;$('#dec').disabled=S.n<=2;$('#inc').disabled=S.n>=10;
  slider.style.setProperty('--p',((S.n-2)/8*100)+'%');document.querySelectorAll('#ticks span').forEach((s,i)=>s.classList.toggle('on',i+2===S.n));
  if(S.box){refit();buildCells();render()}else info();}
slider.oninput=setN;setN();
$('#inc').onclick=()=>{slider.value=Math.min(10,S.n+1);setN()};$('#dec').onclick=()=>{slider.value=Math.max(2,S.n-1);setN()};
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;document.querySelectorAll('#mode button').forEach(x=>x.setAttribute('aria-checked',x===b));setN()});
$('#pre').oninput=e=>{const c=e.target.value.replace(/[^A-Za-z0-9_-]/g,'').slice(0,20);if(c!==e.target.value)e.target.value=c;
  S.prefix=/^(com|lpt)$/i.test(c)?c+'_':c||'a';buildCells();S.box?render():info()};
$('#pad').onchange=()=>{S.pad=$('#pad').checked;buildCells();render()};
$('#reset').onclick=()=>{initBox(true);render()};

/* crop interaction: draw, move, resize (pointer) + keyboard */
let drag=null;
wrap.addEventListener('pointerdown',e=>{if(app.dataset.s!=='edit')return;
  const h=e.target.dataset.h||(crop.contains(e.target)?'move':'draw'),r=wrap.getBoundingClientRect();
  drag={h,sx:e.clientX,sy:e.clientY,b:h==='draw'?{x:clamp((e.clientX-r.left)/S.k,0,S.nw),y:clamp((e.clientY-r.top)/S.k,0,S.nh)}:{...S.box}};
  wrap.setPointerCapture(e.pointerId);e.preventDefault();});
wrap.addEventListener('pointermove',e=>{if(!drag)return;apply((e.clientX-drag.sx)/S.k,(e.clientY-drag.sy)/S.k);render()});
['pointerup','pointercancel'].forEach(t=>wrap.addEventListener(t,()=>drag=null));
function apply(dx,dy){const{h,b}=drag,W=S.nw,H=S.nh,n=S.n,M=Math.max(12,Math.min(W,H)*.03),sq=S.mode==='square';
  if(h==='move'){S.box={...b,x:clamp(b.x+dx,0,W-b.w),y:clamp(b.y+dy,0,H-b.h)};return}
  if(h==='draw'){const px=clamp(b.x+dx,0,W),py=clamp(b.y+dy,0,H),sx=px>=b.x?1:-1,sy=py>=b.y?1:-1;
    if(sq){const maxW=Math.min(sx>0?W-b.x:b.x,(sy>0?H-b.y:b.y)*n),w=clamp(Math.max(Math.abs(px-b.x),Math.abs(py-b.y)*n),Math.min(M*n,maxW),maxW),hh=w/n;
      S.box={x:sx>0?b.x:b.x-w,y:sy>0?b.y:b.y-hh,w,h:hh}}
    else{const w=Math.max(Math.abs(px-b.x),M),hh=Math.max(Math.abs(py-b.y),M);S.box={x:clamp(Math.min(b.x,px),0,W-w),y:clamp(Math.min(b.y,py),0,H-hh),w,h:hh}}return}
  let l=b.x,t=b.y,r=b.x+b.w,bt=b.y+b.h;
  if(sq){const west=h.includes('w'),north=h.includes('n'),ax=west?r:l,ay=north?bt:t,sx=west?-1:1,sy=north?-1:1,px=(west?l:r)+dx,py=(north?t:bt)+dy;
    const maxW=Math.min(sx>0?W-ax:ax,(sy>0?H-ay:ay)*n),minW=Math.min(M*n,maxW),w=clamp(Math.max((px-ax)*sx,(py-ay)*sy*n),minW,maxW),hh=w/n;
    S.box={x:sx>0?ax:ax-w,y:sy>0?ay:ay-hh,w,h:hh};return}
  if(h.includes('w'))l=clamp(l+dx,0,r-M);if(h.includes('e'))r=clamp(r+dx,l+M,W);
  if(h.includes('n'))t=clamp(t+dy,0,bt-M);if(h.includes('s'))bt=clamp(bt+dy,t+M,H);
  S.box={x:l,y:t,w:r-l,h:bt-t};}
crop.addEventListener('keydown',e=>{if(app.dataset.s!=='edit')return;const b=S.box,W=S.nw,H=S.nh,st=Math.max(1,Math.round(Math.min(W,H)/100))*(e.shiftKey?5:1),d={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];
  if(d)S.box={...b,x:clamp(b.x+d[0],0,W-b.w),y:clamp(b.y+d[1],0,H-b.h)};
  else if(['+','=','-'].includes(e.key)){const f=Math.min(e.key==='-'?.95:1.05,W/b.w,H/b.h),w=b.w*f,h=b.h*f;if(Math.min(w,h)<16)return;
    S.box={x:clamp(b.x+b.w/2-w/2,0,W-w),y:clamp(b.y+b.h/2-h/2,0,H-h),w,h}}
  else return;e.preventDefault();render();});

/* zip (store, no compression) */
const CT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=~0;for(let i=0;i<u.length;i++)c=CT[(c^u[i])&255]^(c>>>8);return~c>>>0};
const mk=(len,a)=>{const v=new DataView(new ArrayBuffer(len));a.forEach(([o,s,x])=>s===4?v.setUint32(o,x,true):v.setUint16(o,x,true));return new Uint8Array(v.buffer)};
function makeZip(files){const enc=new TextEncoder(),parts=[],cd=[],d=new Date();let off=0,cdSize=0;
  const time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){const n=enc.encode('squares/'+f.name),c=crc32(f.data),sz=f.data.length;
    parts.push(mk(30,[[0,4,0x04034b50],[4,2,20],[10,2,time],[12,2,date],[14,4,c],[18,4,sz],[22,4,sz],[26,2,n.length]]),n,f.data);
    cd.push(mk(46,[[0,4,0x02014b50],[4,2,20],[6,2,20],[12,2,time],[14,2,date],[16,4,c],[20,4,sz],[24,4,sz],[28,2,n.length],[42,4,off]]),n);cdSize+=46+n.length;off+=30+n.length+sz;}
  return new Blob([...parts,...cd,mk(22,[[0,4,0x06054b50],[8,2,files.length],[10,2,files.length],[12,4,cdSize],[16,4,off]])],{type:'application/zip'});}

/* slice: 1:1 integer pixel copies, so tiles are crisp and seamless */
function prog(p,txt){const v=Math.round(p*100);$('#pf').style.width=v+'%';$('#pp').textContent=v+'%';$('#pb').setAttribute('aria-valuenow',v);if(txt)$('#pt').textContent=txt}
const fmt=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
$('#go').onclick=async()=>{
  const n=S.n,[sw,sh]=dims(),[tw,th]=outDims();
  
  state('busy');prog(0,'Preparing…');await wait(0);
  const bx=Math.round(S.box.x),by=Math.round(S.box.y),files=[];S.urls.forEach(URL.revokeObjectURL);S.urls=[];
  try{
    for(let i=0;i<n;i++){prog(i/(n+1),`Cutting ${nm(i)}…`);await wait(0);
      const c=resample(S.src,Math.min(bx+i*sw,S.nw-sw),Math.min(by,S.nh-sh),sw,sh,tw,th);
      const blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!blob)throw new Error('blob');
      files.push({name:nm(i)+'.png',blob,data:new Uint8Array(await blob.arrayBuffer())});}
    prog(n/(n+1),'Packing folder…');await wait(0);S.zip=makeZip(files);S.files=files;prog(1,'Done');await wait(250);
  }catch(e){state('edit');hintErr('Couldn’t slice this image. It may be too large for this device. Try a smaller crop.');return}
  $('#results').innerHTML=files.map((f,i)=>{const u=URL.createObjectURL(f.blob);S.urls.push(u);return`<button class="tile" data-i="${i}" aria-label="Save ${f.name}"><div class="im" style="aspect-ratio:${tw}/${th}"><img src="${u}" alt=""></div><span class="cap">${nm(i)}</span></button>`}).join('');
  $('#dt').textContent=`${n} ${S.mode==='square'?'squares':'tiles'} ready`;
  $('#ds').textContent=`squares/ · ${files[0].name} – ${files[n-1].name} · ${tw}×${th} px · ${fmt(S.zip.size)}`;
  $('#st').textContent='';state('done');};
$('#back').onclick=()=>state('edit');

/* downloads with button feedback */
function flash(el){if(!el||el.classList.contains('ok'))return;
  if(el.classList.contains('pri')){const h=el.innerHTML;el.classList.add('ok');el.innerHTML=CHECK+'Saved';setTimeout(()=>{el.classList.remove('ok');el.innerHTML=h},2200)}
  else{el.classList.add('ok');setTimeout(()=>el.classList.remove('ok'),1800)}}
async function save(name,blob,el){const st=$('#st');
  try{const dl=window.claude&&claude.use?await claude.use('downloads'):null;
    if(dl)await dl.save({filename:name,data:blob});
    else{const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
    st.textContent='Saved '+name;flash(el);
  }catch(e){st.textContent=e&&e.code==='declined'?'Download cancelled':e&&e.code==='rate_limited'?'One moment, then try again':'Couldn’t save the file. Try again.'}}
$('#dl').onclick=()=>S.zip&&save('squares.zip',S.zip,$('#dl'));
$('#results').addEventListener('click',e=>{const t=e.target.closest('.tile');if(t)save(S.files[+t.dataset.i].name,S.files[+t.dataset.i].blob,t)});
info();state('empty');
})();
</script>
</body>
</html>
